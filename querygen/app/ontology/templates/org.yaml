# Organisation and locations (Odoo 16 res.company, stock.warehouse, stock.location).
# Group, brand, region and branch above the warehouse come from the steward's org map
# (onto_org_map, sub-phase 1.3), not from Odoo fields, so they are not bound here.
# Location role is a steward-set value joined on stock.location.id; see OrgRole below.
name: org
domains:
  - {key: org, label: Organisation}
  - {key: org.structure, label: Company structure, parent: org, synonyms: [companies, legal entities, group]}
  - {key: org.locations, label: Warehouses and locations, parent: org, synonyms: [sites, stores, bins]}
objects:
  - key: company
    label: Company
    domain: org.structure
    base_model: res.company
    synonyms: [company, legal entity, group company, parent company]
    properties:
      - {key: name, label: Company name, role: id, bindings: {"16": name}, synonyms: [company name, legal name]}
      - {key: parent, label: Parent company, role: dimension, bindings: {"16": parent_id}, synonyms: [parent company, group, holding]}
  - key: warehouse
    label: Warehouse
    domain: org.locations
    base_model: stock.warehouse
    synonyms: [warehouse, store, site, depot]
    properties:
      - {key: warehouse_name, label: Warehouse name, role: id, bindings: {"16": name}, synonyms: [warehouse name, store name, site name]}
      - {key: warehouse_code, label: Warehouse code, role: dimension, bindings: {"16": code}, synonyms: [code, short code, store code]}
      - {key: company, label: Company, role: dimension, bindings: {"16": company_id}, synonyms: [company, legal entity]}
      - {key: main_location, label: Main stock location, role: dimension, bindings: {"16": lot_stock_id}, synonyms: [main location, stock location]}
      - {key: view_location, label: Warehouse view location, role: dimension, bindings: {"16": view_location_id}, synonyms: [view location, warehouse root]}
      - {key: reception_steps, label: Reception steps, role: status, bindings: {"16": reception_steps}, synonyms: [receipt steps, reception steps, receiving route]}
  - key: location
    label: Stock location
    domain: org.locations
    base_model: stock.location
    synonyms: [location, bin, storage location, stock location]
    properties:
      - {key: location_name, label: Location name, role: id, bindings: {"16": complete_name}, synonyms: [location name, full location name, location path]}
      - {key: usage, label: Location type, role: status, bindings: {"16": usage}, synonyms: [location type, usage, internal or transit]}
      - {key: warehouse, label: Warehouse, role: dimension, bindings: {"16": warehouse_id}, synonyms: [warehouse, site, store]}
      - {key: company, label: Company, role: dimension, bindings: {"16": company_id}, synonyms: [company]}
      - {key: parent, label: Parent location, role: dimension, bindings: {"16": location_id}, synonyms: [parent location, parent bin]}
      - {key: scrap_flag, label: Scrap location, role: status, bindings: {"16": scrap_location}, synonyms: [scrap location, scrap flag]}
      - {key: return_flag, label: Return location, role: status, bindings: {"16": return_location}, synonyms: [return location, return flag]}
rules: []
metrics: []
org_roles:
  - key: location_role
    label: Location role
    object: location
    synonyms: [location role, role, stock role, qc hold, damaged location]
    # Central, factory, branch, transit, damaged, qc_hold, expired or scrap. Steward-set in onto_org_map.
    values: [central, factory, branch, transit, damaged, qc_hold, expired, scrap]
    joins_on: {"16": id}
links:
  - {key: warehouse_company, label: Warehouse to company, source: warehouse, target: company, via: company, cardinality: "m:1", synonyms: [company of warehouse]}
  - {key: location_warehouse, label: Location to warehouse, source: location, target: warehouse, via: warehouse, cardinality: "m:1", synonyms: [warehouse of location]}
