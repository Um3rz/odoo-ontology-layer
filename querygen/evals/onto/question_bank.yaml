# Onto question bank (plan 3.11). evals/onto/run_bank.py scores it; --dry-run validates it offline.
#
# questions: the seed mapping from plan 1.10. Each entry names a ground-truth case in
#   tests/onto/ground_truth/cases.py (expected_number_source), or a gap probe where the number cannot be
#   computed on that database. tests/onto/ground_truth/test_ground_truth.py checks this list, so keep its shape.
#   `defaults` applies to this list only.
# bank: the chat bank (3.11). Fields: id, question, category, persona (a key of personas), expected_metric
#   (an ontology metric key from app/ontology/templates, or null with a gap reason), truth (a key of truths;
#   a paraphrase uses its base's truth), expected_refusal (default false), paraphrase_of, setup, note.
#   Tolerance and row mode sit on each truth (default tolerance 0.005, as in the demo scorer).
# Demo metric names are mapped to template keys: on_hand_units -> on_hand_qty, sales_revenue -> revenue,
#   confirmed_order_count -> order_count, purchase_spend -> purchase_value, pos_sales -> pos_gross_sales,
#   waste_units -> waste_qty, near_expiry_units -> near_expiry_qty, open_po_units -> open_qty,
#   sales_units_28d -> units_sold. Everything else without a template metric carries a gap reason.
# Truth SQL: the demo's hand SQL, ported from web-app/src/demo/evals/bank.ts (branch feature/onto-demo), with its
#   $1 as-of date written as '2026-08-21'. It ran on the Nordvale demo seed (odoo_fresh, Odoo 16), where the demo's
#   last eval had numbers 100% right. Truths marked "new" are hand-written for this bank.
#   Nothing in this file has been run against a database or a model yet.
defaults:
  category: onto_seed
  persona: admin
  expected_refusal: false
questions:
  - id: q01
    question: How many units of stock do we have on hand in total?
    expected: {object: stock_position, metric: on_hand_qty, dims: []}
    expected_number_source: on_hand_qty.total
  - id: q02
    question: How many units do we have on hand for each product?
    expected: {object: stock_position, metric: on_hand_qty, dims: [product]}
    expected_number_source: on_hand_qty.by_product
  - id: q03
    question: How is stock on hand split across warehouses?
    expected: {object: stock_position, metric: on_hand_qty, dims: [warehouse]}
    expected_number_source: on_hand_qty.by_warehouse
  - id: q04
    question: How many units are reserved for orders?
    expected: {object: stock_position, metric: reserved_qty, dims: []}
    expected_number_source: reserved_qty.total
  - id: q05
    question: How many units can we use now, excluding the quality hold?
    expected: {object: stock_position, metric: usable_qty, dims: []}
    expected_number_source: usable_qty.total_test_map
  - id: q06
    question: How many units are available to promise in each warehouse?
    expected: {object: stock_position, metric: available_qty, dims: [warehouse]}
    expected_number_source: available_qty.by_warehouse
  - id: q07
    question: How many units have expired as of the report date?
    expected: {object: stock_position, metric: expired_qty, dims: []}
    expected_number_source: expired_qty.total_asof
  - id: q08
    question: Which products have expired stock, and how much?
    expected: {object: stock_position, metric: expired_qty, dims: [product]}
    expected_number_source: expired_qty.by_product_asof
  - id: q09
    question: How many units expire in the next 14 days?
    expected: {object: stock_position, metric: near_expiry_qty, dims: []}
    expected_number_source: near_expiry_qty.total_asof
  - id: q10
    question: How many stock lines have been counted?
    expected: {object: stock_position, metric: counted_lines, dims: []}
    expected_number_source: counted_lines.total
  - id: q11
    question: How many counted lines match the system quantity?
    expected: {object: stock_position, metric: matched_lines, dims: []}
    expected_number_source: matched_lines.total
  - id: q12
    question: What is the count accuracy in each warehouse?
    expected: {object: stock_position, metric: count_accuracy, dims: [warehouse]}
    expected_number_source: count_accuracy.by_warehouse
  - id: q13
    question: What is the total count difference in units?
    expected: {object: stock_position, metric: count_diff_qty, dims: []}
    expected_number_source: count_diff_qty.total
  - id: q14
    question: What is the value of the stock we hold?
    expected: {object: stock_valuation, metric: stock_value, dims: []}
    expected_number_source: stock_value.total
  - id: q15
    question: How much cash is tied up in product 145?
    expected: {object: stock_valuation, metric: stock_value, dims: []}
    expected_number_source: stock_value.product145_cash_tied
  - id: q16
    question: What was the cost of goods sold in July 2026?
    expected: {object: stock_valuation, metric: cogs, dims: []}
    expected_number_source: cogs.period_jul
  - id: q17
    question: What was the value of waste in July 2026?
    expected: {object: stock_valuation, metric: waste_value, dims: []}
    expected_number_source: waste_value.period_jul
  - id: q18
    question: What was inventory turnover in July 2026 for each product?
    expected: {object: stock_valuation, metric: turnover, dims: [product]}
    expected_number_source: turnover.period_jul_by_product
  - id: q19
    question: How many days of inventory did we hold in August 2026?
    expected: {object: stock_valuation, metric: days_of_inventory, dims: []}
    expected_number_source: days_of_inventory.period_aug
  - id: q20
    question: How many units were received in July 2026, by product?
    expected: {object: stock_move, metric: goods_received_qty, dims: [product]}
    expected_number_source: goods_received_qty.by_product_jul
  - id: q21
    question: How many units were shipped in July 2026?
    expected: {object: stock_move, metric: goods_shipped_qty, dims: []}
    expected_number_source: goods_shipped_qty.period_jul
  - id: q22
    question: How many transfers are open, by operation type?
    expected: {object: transfer, metric: open_transfer_count, dims: [operation_code]}
    expected_number_source: open_transfer_count.by_operation_code
  - id: q23
    question: How many purchase orders were placed in July 2026, by supplier?
    expected: {object: purchase_order, metric: po_count, dims: [supplier]}
    expected_number_source: po_count.period_jul_by_supplier
  - id: q24
    question: How many units are still outstanding on open purchase orders?
    expected: {object: purchase_order_line, metric: open_qty, dims: []}
    expected_number_source: open_qty.total_outstanding_clamped
  - id: q25
    question: What was the purchase value in July 2026, by supplier?
    expected: {object: purchase_order_line, metric: purchase_value, dims: [supplier]}
    expected_number_source: purchase_value.period_jul_by_supplier
  - id: q26
    question: How many POS orders were taken in July 2026, by till?
    expected: {object: pos_order, metric: pos_order_count, dims: [till]}
    expected_number_source: pos_order_count.period_jul_by_till
  - id: q27
    question: What were POS net sales by week in July 2026?
    expected: {object: pos_order_line, metric: pos_net_sales, dims: []}
    expected_number_source: pos_net_sales.grain_week_jul
  - id: q28
    question: How many sales orders were there in July 2026, by salesperson?
    expected: {object: sales_order, metric: order_count, dims: [salesperson]}
    expected_number_source: order_count.period_jul_by_salesperson
  - id: q29
    question: What was revenue in July 2026 for each product?
    expected: {object: sales_order_line, metric: revenue, dims: [product]}
    expected_number_source: revenue.period_jul_by_product
  - id: q30
    question: What is our gross margin on sales?
    expected: {object: sales_order_line, metric: margin, dims: []}
    expected_number_source: margin.total_refused
    expected_refusal: true  # margin needs the sale_margin unit cost, which odoo_onto lacks

seed: nordvale_fnb
as_of: "2026-08-21"
branch_codes: [WH, A1, A2, A3, B1, B2]
personas:
  admin: {login: admin, allowed_branches: [WH, A1, A2, A3, B1, B2]}
  marieke: {login: marieke.devries@nordvale-fnb.example, allowed_branches: [WH, A1, A2, A3, B1, B2]}
  a1: {login: manager.a1@nordvale-fnb.example, allowed_branches: [A1]}
  a2: {login: manager.a2@nordvale-fnb.example, allowed_branches: [A2]}
  a3: {login: manager.a3@nordvale-fnb.example, allowed_branches: [A3]}

truths:
  onhand_by_branch:
    kind: rows
    sql: |
      select w.code as k, sum(q.quantity)::float as v
      from stock_quant q
      join stock_location l on l.id = q.location_id and l.usage = 'internal' and l.complete_name like '%/Stock'
      join stock_warehouse w on w.id = l.warehouse_id
      group by 1
  atrisk_by_branch:
    kind: rows
    sql: |
      with dem as (
        select w.code b, m.product_id p, sum(m.product_uom_qty) / 28.0 d
        from stock_move m
        join stock_location l on l.id = m.location_id and l.usage = 'internal'
        join stock_warehouse w on w.id = l.warehouse_id
        join stock_location c on c.id = m.location_dest_id and c.usage = 'customer'
        where m.state = 'done' and m.date::date > '2026-08-21'::date - 28 and m.date::date <= '2026-08-21'::date
        group by 1, 2
      ), qty as (
        select w.code b, q.product_id p, sum(q.quantity) q
        from stock_quant q
        join stock_location l on l.id = q.location_id and l.usage = 'internal' and l.complete_name like '%/Stock'
        join stock_warehouse w on w.id = l.warehouse_id
        group by 1, 2
      )
      select dem.b as k, count(*) filter (where coalesce(qty.q, 0) < dem.d)::float as v
      from dem left join qty on qty.b = dem.b and qty.p = dem.p
      where dem.b <> 'WH'
      group by 1
  stock_value_by_branch:
    kind: rows
    tolerance: 1
    sql: |
      select w.code as k, sum(q.quantity * coalesce((select ip.value_float from ir_property ip where ip.name = 'standard_price' and ip.res_id = 'product.product,' || q.product_id order by ip.company_id nulls last limit 1), 0))::float as v
      from stock_quant q
      join stock_location l on l.id = q.location_id and l.usage = 'internal' and l.complete_name like '%/Stock'
      join stock_warehouse w on w.id = l.warehouse_id
      group by 1
  days_of_stock_bergbach:
    kind: rows
    tolerance: 0.1
    sql: |
      with dem as (
        select w.code b, m.product_id p, sum(m.product_uom_qty) / 28.0 d
        from stock_move m
        join stock_location l on l.id = m.location_id and l.usage = 'internal'
        join stock_warehouse w on w.id = l.warehouse_id
        join stock_location c on c.id = m.location_dest_id and c.usage = 'customer'
        where m.state = 'done' and m.date::date > '2026-08-21'::date - 28 and m.date::date <= '2026-08-21'::date
        group by 1, 2
      ), qty as (
        select w.code b, q.product_id p, sum(q.quantity) q
        from stock_quant q
        join stock_location l on l.id = q.location_id and l.usage = 'internal' and l.complete_name like '%/Stock'
        join stock_warehouse w on w.id = l.warehouse_id
        group by 1, 2
      )
      select dem.b as k, round((coalesce(qty.q, 0) / dem.d)::numeric, 1)::float as v
      from dem left join qty on qty.b = dem.b and qty.p = dem.p
      join product_product pp on pp.id = dem.p
      join product_template pt on pt.id = pp.product_tmpl_id
      where pt.name->>'en_US' = 'Bergbach Sparkling 330ml - Case of 24' and dem.b <> 'WH'
  near_expiry_by_product:
    kind: rows
    sql: |
      select pt.name->>'en_US' as k, sum(q.quantity)::float as v
      from stock_quant q
      join stock_lot lot on lot.id = q.lot_id
      join stock_location l on l.id = q.location_id and l.usage = 'internal' and l.complete_name like '%/Stock'
      join product_product pp on pp.id = q.product_id
      join product_template pt on pt.id = pp.product_tmpl_id
      where q.quantity > 0 and lot.expiration_date::date <= '2026-08-21'::date + 14
      group by 1
  scrap_by_branch:
    kind: rows
    sql: |
      select w.code as k, sum(s.scrap_qty)::float as v
      from stock_scrap s
      join stock_location l on l.id = s.location_id
      join stock_warehouse w on w.id = l.warehouse_id
      where s.state = 'done'
      group by 1
  scrap_total:
    kind: scalar
    sql: |
      select sum(scrap_qty)::float as v from stock_scrap where state = 'done'
  late_po_by_supplier:
    kind: rows
    sql: |
      select rp.name as k, count(*)::float as v
      from purchase_order_line pol
      join purchase_order po on po.id = pol.order_id and po.state = 'purchase'
      join res_partner rp on rp.id = po.partner_id
      where pol.qty_received < pol.product_qty and pol.date_planned::date < '2026-08-21'::date
      group by 1
  open_po_bergbach:
    kind: scalar
    sql: |
      select sum(pol.product_qty - pol.qty_received)::float as v
      from purchase_order_line pol
      join purchase_order po on po.id = pol.order_id and po.state = 'purchase'
      join product_product pp on pp.id = pol.product_id
      join product_template pt on pt.id = pp.product_tmpl_id
      where pt.name->>'en_US' = 'Bergbach Sparkling 330ml - Case of 24' and pol.qty_received < pol.product_qty
  deliveries_done_by_wh:
    kind: rows
    sql: |
      select w.code as k, count(*)::float as v
      from stock_picking p
      join stock_picking_type t on t.id = p.picking_type_id and t.name->>'en_US' = 'Delivery Orders'
      join stock_warehouse w on w.id = t.warehouse_id
      where p.state = 'done'
      group by 1
  deliveries_open:
    kind: scalar
    sql: |
      select count(*)::float as v
      from stock_picking p
      join stock_picking_type t on t.id = p.picking_type_id and t.name->>'en_US' = 'Delivery Orders'
      where p.state not in ('done', 'cancel')
  receipts_done_by_wh:
    kind: rows
    sql: |
      select w.code as k, count(*)::float as v
      from stock_picking p
      join stock_picking_type t on t.id = p.picking_type_id and t.name->>'en_US' = 'Receipts'
      join stock_warehouse w on w.id = t.warehouse_id
      where p.state = 'done'
      group by 1
  transfers_by_type:
    kind: rows
    sql: |
      select t.name->>'en_US' as k, count(*)::float as v
      from stock_picking p
      join stock_picking_type t on t.id = p.picking_type_id
      group by 1
  contacts_by_country_top:
    kind: rows
    mode: top
    sql: |
      select c.name->>'en_US' as k, count(*)::float as v
      from res_partner p join res_country c on c.id = p.country_id
      where p.active
      group by 1 order by 2 desc limit 1
  products_by_category:
    kind: rows
    sql: |
      select pc.complete_name as k, count(*)::float as v
      from product_template pt join product_category pc on pc.id = pt.categ_id
      where pt.active
      group by 1
  journal_top:
    kind: rows
    mode: top
    sql: |
      select j.name as k, count(*)::float as v
      from account_move m join account_journal j on j.id = m.journal_id
      where m.state = 'posted'
      group by 1 order by 2 desc limit 1
  sales_taxes_active:
    kind: scalar
    sql: |
      select count(*)::float as v from account_tax where active and type_tax_use = 'sale'
  users_active:
    kind: scalar
    sql: |
      select count(*)::float as v from res_users where active
  lots_top:
    kind: rows
    mode: top
    sql: |
      select pt.name->>'en_US' as k, count(*)::float as v
      from stock_lot l
      join product_product pp on pp.id = l.product_id
      join product_template pt on pt.id = pp.product_tmpl_id
      group by 1 order by 2 desc, 1 limit 1
  payment_terms_orders:
    kind: rows
    sql: |
      select pt.name->>'en_US' as k, count(*)::float as v
      from sale_order so join account_payment_term pt on pt.id = so.payment_term_id
      where so.state in ('sale', 'done')
      group by 1
  sales_total:
    kind: scalar
    tolerance: 0.01
    sql: |
      select sum(so.amount_untaxed)::float as v from sale_order so where so.state in ('sale', 'done')
  sales_orders_count:
    kind: scalar
    sql: |
      select count(*)::float as v from sale_order so where so.state in ('sale', 'done')
  sales_aov:
    kind: scalar
    tolerance: 0.01
    sql: |
      select avg(so.amount_untaxed)::float as v from sale_order so where so.state in ('sale', 'done')
  sales_top5_customers:
    kind: rows
    mode: top
    tolerance: 0.01
    sql: |
      select coalesce(cp.name, p.name) as k, sum(so.amount_untaxed)::float as v
      from sale_order so
      join res_partner p on p.id = so.partner_id
      left join res_partner cp on cp.id = p.commercial_partner_id
      where so.state in ('sale', 'done')
      group by 1 order by 2 desc limit 5
  top_customer:  # new: the single top customer, for the access question
    kind: rows
    mode: top
    tolerance: 0.01
    sql: |
      select coalesce(cp.name, p.name) as k, sum(so.amount_untaxed)::float as v
      from sale_order so
      join res_partner p on p.id = so.partner_id
      left join res_partner cp on cp.id = p.commercial_partner_id
      where so.state in ('sale', 'done')
      group by 1 order by 2 desc limit 1
  sales_by_month:
    kind: rows
    tolerance: 0.01
    sql: |
      select to_char(so.date_order, 'YYYY-MM') as k, sum(so.amount_untaxed)::float as v
      from sale_order so where so.state in ('sale', 'done')
      group by 1
  sales_by_category:
    kind: rows
    tolerance: 0.01
    sql: |
      select pc.name as k, sum(sol.price_subtotal)::float as v
      from sale_order_line sol
      join sale_order so on so.id = sol.order_id and so.state in ('sale', 'done')
      join product_product pp on pp.id = sol.product_id
      join product_template pt on pt.id = pp.product_tmpl_id
      join product_category pc on pc.id = pt.categ_id
      where sol.display_type is null
      group by 1
  pos_total:
    kind: scalar
    tolerance: 0.01
    sql: |
      select sum(amount_total)::float as v from pos_order where state in ('paid', 'done', 'invoiced')
  pos_by_shop:
    kind: rows
    tolerance: 0.01
    sql: |
      select c.name as k, sum(o.amount_total)::float as v
      from pos_order o
      join pos_session s on s.id = o.session_id
      join pos_config c on c.id = s.config_id
      where o.state in ('paid', 'done', 'invoiced')
      group by 1
  purchase_total:
    kind: scalar
    tolerance: 0.01
    sql: |
      select sum(pol.price_subtotal)::float as v
      from purchase_order_line pol
      join purchase_order po on po.id = pol.order_id and po.state in ('purchase', 'done')
      where pol.display_type is null
  purchase_top5_suppliers:
    kind: rows
    mode: top
    tolerance: 0.01
    sql: |
      select p.name as k, sum(pol.price_subtotal)::float as v
      from purchase_order_line pol
      join purchase_order po on po.id = pol.order_id and po.state in ('purchase', 'done')
      join res_partner p on p.id = po.partner_id
      where pol.display_type is null
      group by 1 order by 2 desc limit 5
  invoiced_total:
    kind: scalar
    tolerance: 0.01
    sql: |
      select sum(case when m.move_type = 'out_refund' then -abs(m.amount_untaxed_signed) else abs(m.amount_untaxed_signed) end)::float as v
      from account_move m
      where m.state = 'posted' and m.move_type in ('out_invoice', 'out_refund')
  vendor_bills_total:
    kind: scalar
    tolerance: 0.01
    sql: |
      select sum(case when m.move_type = 'in_refund' then -abs(m.amount_untaxed_signed) else abs(m.amount_untaxed_signed) end)::float as v
      from account_move m
      where m.state = 'posted' and m.move_type in ('in_invoice', 'in_refund')
  receivables_outstanding:
    kind: scalar
    tolerance: 0.01
    sql: |
      select sum(case when m.move_type = 'out_refund' then -abs(m.amount_residual_signed) else abs(m.amount_residual_signed) end)::float as v
      from account_move m
      where m.state = 'posted' and m.move_type in ('out_invoice', 'out_refund') and m.payment_state in ('not_paid', 'partial', 'in_payment')
  customer_contacts:
    kind: scalar
    sql: |
      select count(*)::float as v from res_partner where active and customer_rank > 0
  overstock_value:
    kind: scalar
    tolerance: 1
    sql: |
      with dem as (
        select w.code b, m.product_id p, sum(m.product_uom_qty) / 28.0 d
        from stock_move m
        join stock_location l on l.id = m.location_id and l.usage = 'internal'
        join stock_warehouse w on w.id = l.warehouse_id
        join stock_location c on c.id = m.location_dest_id and c.usage = 'customer'
        where m.state = 'done' and m.date::date > '2026-08-21'::date - 28 and m.date::date <= '2026-08-21'::date
        group by 1, 2
      ), pos as (
        select w.code b, q.product_id p, sum(q.quantity) qty
        from stock_quant q
        join stock_location l on l.id = q.location_id and l.usage = 'internal' and l.complete_name like '%/Stock'
        join stock_warehouse w on w.id = l.warehouse_id
        group by 1, 2
      )
      select sum(greatest(pos.qty - 90 * coalesce(dem.d, 0), 0) * coalesce((select ip.value_float from ir_property ip where ip.name = 'standard_price' and ip.res_id = 'product.product,' || pos.p order by ip.company_id nulls last limit 1), 0))::float as v
      from pos left join dem on dem.b = pos.b and dem.p = pos.p
  onhand_by_branch_a1:
    kind: rows
    sql: |
      select w.code as k, sum(q.quantity)::float as v
      from stock_quant q
      join stock_location l on l.id = q.location_id and l.usage = 'internal' and l.complete_name like '%/Stock'
      join stock_warehouse w on w.id = l.warehouse_id
      where w.code = 'A1'
      group by 1
  atrisk_total_a1:
    kind: scalar
    sql: |
      select sum(v)::float as v from (
        with dem as (
          select w.code b, m.product_id p, sum(m.product_uom_qty) / 28.0 d
          from stock_move m
          join stock_location l on l.id = m.location_id and l.usage = 'internal'
          join stock_warehouse w on w.id = l.warehouse_id
          join stock_location c on c.id = m.location_dest_id and c.usage = 'customer'
          where m.state = 'done' and m.date::date > '2026-08-21'::date - 28 and m.date::date <= '2026-08-21'::date
          group by 1, 2
        ), qty as (
          select w.code b, q.product_id p, sum(q.quantity) q
          from stock_quant q
          join stock_location l on l.id = q.location_id and l.usage = 'internal' and l.complete_name like '%/Stock'
          join stock_warehouse w on w.id = l.warehouse_id
          group by 1, 2
        )
        select dem.b as k, count(*) filter (where coalesce(qty.q, 0) < dem.d)::float as v
        from dem left join qty on qty.b = dem.b and qty.p = dem.p
        where dem.b <> 'WH' and dem.b = 'A1'
        group by 1
      ) t
  stock_value_a1:
    kind: rows
    tolerance: 1
    sql: |
      select w.code as k, sum(q.quantity * coalesce((select ip.value_float from ir_property ip where ip.name = 'standard_price' and ip.res_id = 'product.product,' || q.product_id order by ip.company_id nulls last limit 1), 0))::float as v
      from stock_quant q
      join stock_location l on l.id = q.location_id and l.usage = 'internal' and l.complete_name like '%/Stock'
      join stock_warehouse w on w.id = l.warehouse_id
      where w.code = 'A1'
      group by 1
  onhand_by_branch_a2:
    kind: rows
    sql: |
      select w.code as k, sum(q.quantity)::float as v
      from stock_quant q
      join stock_location l on l.id = q.location_id and l.usage = 'internal' and l.complete_name like '%/Stock'
      join stock_warehouse w on w.id = l.warehouse_id
      where w.code = 'A2'
      group by 1
  onhand_by_branch_a3:
    kind: rows
    sql: |
      select w.code as k, sum(q.quantity)::float as v
      from stock_quant q
      join stock_location l on l.id = q.location_id and l.usage = 'internal' and l.complete_name like '%/Stock'
      join stock_warehouse w on w.id = l.warehouse_id
      where w.code = 'A3'
      group by 1
  onhand_a3_by_category:
    kind: rows
    sql: |
      select pc.name as k, sum(q.quantity)::float as v
      from stock_quant q
      join stock_location l on l.id = q.location_id and l.usage = 'internal' and l.complete_name like '%/Stock'
      join stock_warehouse w on w.id = l.warehouse_id
      join product_product pp on pp.id = q.product_id
      join product_template pt on pt.id = pp.product_tmpl_id
      join product_category pc on pc.id = pt.categ_id
      where w.code = 'A3'
      group by 1
  sold_28d_b2:
    kind: scalar
    sql: |
      select sum(m.product_uom_qty)::float as v
      from stock_move m
      join stock_location l on l.id = m.location_id and l.usage = 'internal'
      join stock_warehouse w on w.id = l.warehouse_id
      join stock_location c on c.id = m.location_dest_id and c.usage = 'customer'
      where w.code = 'B2' and m.state = 'done' and m.date::date > '2026-08-21'::date - 28 and m.date::date <= '2026-08-21'::date
  atrisk_products_a1:
    kind: rows
    mode: positive_keys
    sql: |
      with dem as (
        select w.code b, m.product_id p, sum(m.product_uom_qty) / 28.0 d
        from stock_move m
        join stock_location l on l.id = m.location_id and l.usage = 'internal'
        join stock_warehouse w on w.id = l.warehouse_id
        join stock_location c on c.id = m.location_dest_id and c.usage = 'customer'
        where m.state = 'done' and m.date::date > '2026-08-21'::date - 28 and m.date::date <= '2026-08-21'::date
        group by 1, 2
      ), qty as (
        select w.code b, q.product_id p, sum(q.quantity) q
        from stock_quant q
        join stock_location l on l.id = q.location_id and l.usage = 'internal' and l.complete_name like '%/Stock'
        join stock_warehouse w on w.id = l.warehouse_id
        group by 1, 2
      )
      select pt.name->>'en_US' as k, 1::float as v
      from dem left join qty on qty.b = dem.b and qty.p = dem.p
      join product_product pp on pp.id = dem.p
      join product_template pt on pt.id = pp.product_tmpl_id
      where dem.b = 'A1' and coalesce(qty.q, 0) < dem.d
  sales_2019:
    kind: scalar
    sql: |
      select coalesce(sum(amount_untaxed), 0)::float as v from sale_order where state in ('sale', 'done') and date_order < '2025-01-01'
  stock_value_total:  # new: all branches, for "total inventory value" (BRD section 30)
    kind: scalar
    tolerance: 1
    sql: |
      select sum(q.quantity * coalesce((select ip.value_float from ir_property ip where ip.name = 'standard_price' and ip.res_id = 'product.product,' || q.product_id order by ip.company_id nulls last limit 1), 0))::float as v
      from stock_quant q
      join stock_location l on l.id = q.location_id and l.usage = 'internal' and l.complete_name like '%/Stock'
      join stock_warehouse w on w.id = l.warehouse_id
  run_out_14d_by_branch:  # new: products below 14 days of stock per branch (BRD section 30); on-hand only
    kind: rows
    sql: |
      with dem as (
        select w.code b, m.product_id p, sum(m.product_uom_qty) / 28.0 d
        from stock_move m
        join stock_location l on l.id = m.location_id and l.usage = 'internal'
        join stock_warehouse w on w.id = l.warehouse_id
        join stock_location c on c.id = m.location_dest_id and c.usage = 'customer'
        where m.state = 'done' and m.date::date > '2026-08-21'::date - 28 and m.date::date <= '2026-08-21'::date
        group by 1, 2
      ), qty as (
        select w.code b, q.product_id p, sum(q.quantity) q
        from stock_quant q
        join stock_location l on l.id = q.location_id and l.usage = 'internal' and l.complete_name like '%/Stock'
        join stock_warehouse w on w.id = l.warehouse_id
        group by 1, 2
      )
      select dem.b as k, count(*)::float as v
      from dem left join qty on qty.b = dem.b and qty.p = dem.p
      where dem.b <> 'WH' and dem.d > 0 and coalesce(qty.q, 0) < 14 * dem.d
      group by 1
  stock_value_total_a1:  # new: branch A1 only
    kind: scalar
    tolerance: 1
    sql: |
      select sum(q.quantity * coalesce((select ip.value_float from ir_property ip where ip.name = 'standard_price' and ip.res_id = 'product.product,' || q.product_id order by ip.company_id nulls last limit 1), 0))::float as v
      from stock_quant q
      join stock_location l on l.id = q.location_id and l.usage = 'internal' and l.complete_name like '%/Stock'
      join stock_warehouse w on w.id = l.warehouse_id
      where w.code = 'A1'
  sold_28d_a1:  # new: branch A1 only
    kind: scalar
    sql: |
      select sum(m.product_uom_qty)::float as v
      from stock_move m
      join stock_location l on l.id = m.location_id and l.usage = 'internal'
      join stock_warehouse w on w.id = l.warehouse_id
      join stock_location c on c.id = m.location_dest_id and c.usage = 'customer'
      where w.code = 'A1' and m.state = 'done' and m.date::date > '2026-08-21'::date - 28 and m.date::date <= '2026-08-21'::date
  stock_value_a2:  # new: branch A2 only
    kind: rows
    tolerance: 1
    sql: |
      select w.code as k, sum(q.quantity * coalesce((select ip.value_float from ir_property ip where ip.name = 'standard_price' and ip.res_id = 'product.product,' || q.product_id order by ip.company_id nulls last limit 1), 0))::float as v
      from stock_quant q
      join stock_location l on l.id = q.location_id and l.usage = 'internal' and l.complete_name like '%/Stock'
      join stock_warehouse w on w.id = l.warehouse_id
      where w.code = 'A2'
      group by 1
  atrisk_products_a3:  # new: branch A3 only
    kind: rows
    mode: positive_keys
    sql: |
      with dem as (
        select w.code b, m.product_id p, sum(m.product_uom_qty) / 28.0 d
        from stock_move m
        join stock_location l on l.id = m.location_id and l.usage = 'internal'
        join stock_warehouse w on w.id = l.warehouse_id
        join stock_location c on c.id = m.location_dest_id and c.usage = 'customer'
        where m.state = 'done' and m.date::date > '2026-08-21'::date - 28 and m.date::date <= '2026-08-21'::date
        group by 1, 2
      ), qty as (
        select w.code b, q.product_id p, sum(q.quantity) q
        from stock_quant q
        join stock_location l on l.id = q.location_id and l.usage = 'internal' and l.complete_name like '%/Stock'
        join stock_warehouse w on w.id = l.warehouse_id
        group by 1, 2
      )
      select pt.name->>'en_US' as k, 1::float as v
      from dem left join qty on qty.b = dem.b and qty.p = dem.p
      join product_product pp on pp.id = dem.p
      join product_template pt on pt.id = pp.product_tmpl_id
      where dem.b = 'A3' and coalesce(qty.q, 0) < dem.d

